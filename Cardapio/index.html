                    // 5 = Sexta
                    // 6 = Sábado

                    const hoje = new Date().getDay();
                    const promocaoAtiva = hoje !== 6; // Promoção em todos os dias, exceto sábado

                    const emPromocao =
                        promocaoAtiva &&
                        promocoes[sabor.id] &&
                        promocoes[sabor.id].grande !== undefined;

                    const precoGrande = emPromocao
                        ? promocoes[sabor.id].grande
                        : sabor.precos.grande;

                    const card = document.createElement('div');
                    card.className = "bg-white p-3 sm:p-4 rounded-3xl shadow-sm hover:shadow-md transition-all duration-300 border border-gray-100 flex gap-3 sm:gap-4";
                    card.innerHTML = `
                        <div class="flex-shrink-0 w-16 h-16 sm:w-24 sm:h-24 bg-red-50 rounded-2xl flex items-center justify-center text-2xl sm:text-4xl">
                            ${sabor.categoria === 'doces' ? '🍫' : '🍕'}
                        </div>
                        <div class="flex flex-col justify-between flex-1 min-w-0">
                            <div>
                                <div class="flex items-start justify-between gap-2 flex-wrap">
                                    <div class="min-w-0">
                                        <h4 class="font-bold text-gray-800 text-sm sm:text-base leading-snug">${sabor.nome}</h4>
                                        ${emPromocao ? `<span class="inline-block mt-1 bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded-full">🔥 PROMOÇÃO</span>` : ''}
                                    </div>
                                    <span class="flex-shrink-0 text-[10px] bg-red-100 text-primary font-bold px-1.5 py-0.5 rounded uppercase">
                                        ${sabor.categoria === 'doces' ? 'Doce' : 'Salgada'}
                                    </span>
                                </div>
                                <p class="text-[11px] sm:text-xs text-gray-500 mt-1 leading-snug">${sabor.ingredientes.join(', ')}</p>
                            </div>
                            <div class="flex justify-between items-end mt-2">
                                <div class="space-y-0.5">
                                    <p class="text-[11px] text-gray-500">Broto: <span class="font-bold text-gray-700">R$ ${sabor.precos.broto.toFixed(2).replace('.', ',')}</span></p>
                                    <p class="text-[11px] text-gray-500">Média: <span class="font-bold text-gray-700">R$ ${sabor.precos.media.toFixed(2).replace('.', ',')}</span></p>
                                    <p class="text-[11px] text-gray-500">
                                        Grande:
                                        ${emPromocao ? `<span class="line-through text-gray-400">R$ ${sabor.precos.grande.toFixed(2).replace('.', ',')}</span> ` : ''}
                                        <span class="font-bold ${emPromocao ? 'text-red-600' : 'text-gray-700'}">R$ ${precoGrande.toFixed(2).replace('.', ',')}</span>
                                    </p>
                                </div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            if (categoriaAtiva === 'todas' || categoriaAtiva === 'bebidas') {
                bebidas.forEach(bebida => {
                    if (termo && !bebida.nome.toLowerCase().includes(termo) && !bebida.descricao.toLowerCase().includes(termo)) return;
                    const card = document.createElement('div');
                    card.className = "bg-white p-3 sm:p-4 rounded-3xl shadow-sm hover:shadow-md transition-all duration-300 border border-gray-100 flex gap-3 sm:gap-4";
                    card.innerHTML = `
                        <div class="flex-shrink-0 w-16 h-16 sm:w-24 sm:h-24 bg-blue-50 rounded-2xl flex items-center justify-center text-2xl sm:text-4xl">🥤</div>
                        <div class="flex flex-col justify-between flex-1 min-w-0">
                            <div>
                                <h4 class="font-bold text-gray-800 text-sm sm:text-base leading-snug">${bebida.nome}</h4>
                                <p class="text-[11px] sm:text-xs text-gray-500 mt-1">${bebida.descricao}</p>
                            </div>
                            <span class="text-sm sm:text-base font-extrabold text-[#C62828] mt-2">R$ ${bebida.preco.toFixed(2).replace('.', ',')}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            if (categoriaAtiva === 'todas' || categoriaAtiva === 'sobremesas') {
                sobremesas.forEach(sobremesa => {
                    if (termo && !sobremesa.nome.toLowerCase().includes(termo) && !sobremesa.descricao.toLowerCase().includes(termo)) return;
                    const card = document.createElement('div');
                    card.className = "bg-white p-3 sm:p-4 rounded-3xl shadow-sm hover:shadow-md transition-all duration-300 border border-gray-100 flex gap-3 sm:gap-4";
                    card.innerHTML = `
                        <div class="flex-shrink-0 w-16 h-16 sm:w-24 sm:h-24 bg-pink-50 rounded-2xl flex items-center justify-center text-2xl sm:text-4xl">🍰</div>
                        <div class="flex flex-col justify-between flex-1 min-w-0">
                            <div>
                                <h4 class="font-bold text-gray-800 text-sm sm:text-base leading-snug">${sobremesa.nome}</h4>
                                <p class="text-[11px] sm:text-xs text-gray-500 mt-1">${sobremesa.descricao}</p>
                            </div>
                            <span class="text-sm sm:text-base font-extrabold text-[#C62828] mt-2">R$ ${sobremesa.preco.toFixed(2).replace('.', ',')}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            if (container.children.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <span class="text-5xl block mb-3">🧐</span>
                        <h4 class="font-bold text-gray-700 text-lg">Nenhum produto encontrado</h4>
                        <p class="text-sm text-gray-400 mt-1">Experimente buscar por outras palavras-chave.</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
